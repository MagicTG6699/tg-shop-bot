name: TG Shop Bot

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  schedule:
    - cron: '0 */3 * * *'

permissions:
  actions: write
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    concurrency:
      group: tg-bot-instance
      cancel-in-progress: true

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装 Playwright 浏览器
        run: |
          playwright install --with-deps chromium

      - name: 启动机器人
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}

          ADMIN_URL: ${{ secrets.ADMIN_URL }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}

          SINGLE_ADMIN_URL: ${{ secrets.SINGLE_ADMIN_URL }}
          SINGLE_ADMIN_USER: ${{ secrets.SINGLE_ADMIN_USER }}
          SINGLE_ADMIN_PASS: ${{ secrets.SINGLE_ADMIN_PASS }}

          JJ_ADMIN_URL: ${{ secrets.JJ_ADMIN_URL }}
          JJ_ADMIN_USER: ${{ secrets.JJ_ADMIN_USER }}
          JJ_ADMIN_PASS: ${{ secrets.JJ_ADMIN_PASS }}
          JJ_2FA_SECRET: ${{ secrets.JJ_2FA_SECRET }}

          GH_TOKEN: ${{ github.token }}

        run: |
          # 在当前机器人 Workflow 内后台清理旧记录。
          # 不再建立第二个 cleanup Workflow，因此不会因为清理而额外产生一笔 Actions 运行记录。
          # 规则：只处理 completed；最新 10 笔保留；第 11 笔及更旧的删除。
          (
            current_minute=$((10#$(date +%M)))
            current_second=$((10#$(date +%S)))

            if [ "$current_minute" -lt 30 ]; then
              sleep_seconds=$(( (30 - current_minute) * 60 - current_second ))
            else
              sleep_seconds=$(( (90 - current_minute) * 60 - current_second ))
            fi

            sleep "$sleep_seconds"

            while true; do
              RUNS=$(gh run list                 --repo "${{ github.repository }}"                 --workflow "TG Shop Bot"                 --limit 100                 --json databaseId,status,createdAt                 --jq '.[] | select(.status == "completed") | .databaseId')

              COUNT=0

              for RUN_ID in $RUNS; do
                COUNT=$((COUNT + 1))

                if [ "$COUNT" -le 10 ]; then
                  continue
                fi

                gh run delete "$RUN_ID"                   --repo "${{ github.repository }}"                   --confirm || true
              done

              sleep 10800
            done
          ) >/dev/null 2>&1 &

          CLEANUP_PID=$!
          trap 'kill "$CLEANUP_PID" 2>/dev/null || true' EXIT INT TERM

          python -u main.py
