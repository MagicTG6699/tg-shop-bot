name: Run TG Shop Bot

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装项目依赖与 Playwright 浏览器
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 启动机器人
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MARKET_MANAGER_URL: ${{ secrets.MARKET_MANAGER_URL }}
          MARKET_MANAGER_ACCOUNT: ${{ secrets.MARKET_MANAGER_ACCOUNT }}
          MARKET_MANAGER_PASSWORD: ${{ secrets.MARKET_MANAGER_PASSWORD }}
          MALL_ADMIN_URL: ${{ secrets.MALL_ADMIN_URL }}
          MALL_ADMIN_ACCOUNT: ${{ secrets.MALL_ADMIN_ACCOUNT }}
          MALL_ADMIN_PASSWORD: ${{ secrets.MALL_ADMIN_PASSWORD }}
          JJ_BACKEND_URL: ${{ secrets.JJ_BACKEND_URL }}
          JJ_ACCOUNT: ${{ secrets.JJ_ACCOUNT }}
          JJ_PASSWORD: ${{ secrets.JJ_PASSWORD }}
          SHOP_BASE_URL: ${{ secrets.SHOP_BASE_URL }}
        run: |
          python main.py
