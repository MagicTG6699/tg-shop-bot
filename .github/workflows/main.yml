name: TG Shop Bot

on:
  workflow_dispatch:      # 支持手动点击运行
  push:
    branches: [ "main" ]  # 推送代码时触发
  schedule:
    - cron: '0 */3 * * *' # 每 3 小时自动重新触发，无缝防断线

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 240 # 单次运行上限 4 小时，超时后自动由新的 cron 任务接替
    concurrency:
      group: tg-bot-instance
      cancel-in-progress: true # 触发新任务时，自动终止旧任务，防止多实例重复挂机

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装 Playwright 及其系统依赖
        run: |
          playwright install --with-deps chromium

      - name: 启动机器人
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
          ADMIN_URL: ${{ secrets.ADMIN_URL }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          python main.py
