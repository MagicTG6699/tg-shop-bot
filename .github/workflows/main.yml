name: TG Shop Bot

on:
  workflow_dispatch:

  push:
    branches: ["main"]

  schedule:
    - cron: '0 */3 * * *'


# 允许 Workflow 删除旧的 Actions 运行记录
permissions:
  contents: read
  actions: write


jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    concurrency:
      group: tg-bot-instance
      cancel-in-progress: true

    steps:

      # ==========================================
      # 拉取仓库代码
      # ==========================================
      - name: 拉取仓库代码
        uses: actions/checkout@v4


      # ==========================================
      # 设置 Python 环境
      # ==========================================
      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'


      # ==========================================
      # 安装 Python 依赖
      # ==========================================
      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ==========================================
      # 安装 Playwright 浏览器
      # ==========================================
      - name: 安装 Playwright 浏览器
        run: |
          playwright install --with-deps chromium


      # ==========================================
      # 启动机器人
      # ==========================================
      - name: 启动机器人
        env:
          # Telegram
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}

          # 全部商城
          ADMIN_URL: ${{ secrets.ADMIN_URL }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}

          # 单笔商城
          SINGLE_ADMIN_URL: ${{ secrets.SINGLE_ADMIN_URL }}
          SINGLE_ADMIN_USER: ${{ secrets.SINGLE_ADMIN_USER }}
          SINGLE_ADMIN_PASS: ${{ secrets.SINGLE_ADMIN_PASS }}

          # JJ订单后台
          JJ_ADMIN_URL: ${{ secrets.JJ_ADMIN_URL }}
          JJ_ADMIN_USER: ${{ secrets.JJ_ADMIN_USER }}
          JJ_ADMIN_PASS: ${{ secrets.JJ_ADMIN_PASS }}
          JJ_2FA_SECRET: ${{ secrets.JJ_2FA_SECRET }}

        run: |
          python -u main.py


      # ==========================================
      # 自动清理旧的 GitHub Actions 运行记录
      # ==========================================
      #
      # 规则：
      # 1. 只处理已经 completed 的运行记录
      # 2. 最近 10 笔已完成记录保留
      # 3. 第 11 笔以及更旧的已完成记录删除
      # 4. 正在运行中的记录不会删除
      # 5. 不会影响 main.py / Telegram Bot / Secrets
      #
      - name: 清理旧的运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          echo "=========================================="
          echo "开始清理旧的 GitHub Actions 运行记录"
          echo "=========================================="

          echo "Workflow: ${{ github.workflow }}"
          echo "Repository: ${{ github.repository }}"
          echo ""

          # 获取最近的已完成运行记录
          RUNS=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow "${{ github.workflow }}" \
            --limit 100 \
            --json databaseId,status \
            --jq '.[] | select(.status == "completed") | .databaseId')

          COUNT=0

          for RUN_ID in $RUNS; do
            COUNT=$((COUNT + 1))

            # 最近 10 笔已完成记录保留
            if [ "$COUNT" -le 10 ]; then
              echo "保留第 ${COUNT} 笔已完成记录：${RUN_ID}"
            else
              echo "删除旧记录：${RUN_ID}"

              gh run delete "$RUN_ID" \
                --repo "${{ github.repository }}" \
                --confirm || true
            fi
          done

          echo ""
          echo "=========================================="
          echo "清理完成"
          echo "保留最近 10 笔已完成记录"
          echo "=========================================="
