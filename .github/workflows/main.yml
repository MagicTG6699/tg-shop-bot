name: TG Shop Bot

on:
  workflow_dispatch:

  push:
    branches: ["main"]

  schedule:
    - cron: '0 */3 * * *'
    - cron: '30 */3 * * *'

permissions:
  actions: write
  contents: read

jobs:
  run-bot:
    if: >-
      github.event_name != 'schedule' ||
      github.event.schedule == '0 */3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 240

    concurrency:
      group: tg-bot-instance
      cancel-in-progress: true

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装 Playwright 浏览器
        run: |
          playwright install --with-deps chromium

      - name: 启动机器人
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}

          ADMIN_URL: ${{ secrets.ADMIN_URL }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}

          SINGLE_ADMIN_URL: ${{ secrets.SINGLE_ADMIN_URL }}
          SINGLE_ADMIN_USER: ${{ secrets.SINGLE_ADMIN_USER }}
          SINGLE_ADMIN_PASS: ${{ secrets.SINGLE_ADMIN_PASS }}

          JJ_ADMIN_URL: ${{ secrets.JJ_ADMIN_URL }}
          JJ_ADMIN_USER: ${{ secrets.JJ_ADMIN_USER }}
          JJ_ADMIN_PASS: ${{ secrets.JJ_ADMIN_PASS }}
          JJ_2FA_SECRET: ${{ secrets.JJ_2FA_SECRET }}

        run: |
          python -u main.py

  cleanup:
    if: >-
      github.event_name == 'schedule' &&
      github.event.schedule == '30 */3 * * *'
    runs-on: ubuntu-latest

    steps:
      - name: 清理旧的 TG Shop Bot 运行记录
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=========================================="
          echo "开始清理 TG Shop Bot 历史运行记录"
          echo "=========================================="

          echo ""
          echo "Repository: ${{ github.repository }}"
          echo ""

          RUNS=$(gh run list             --repo "${{ github.repository }}"             --workflow "TG Shop Bot"             --limit 100             --json databaseId,status,createdAt             --jq '.[] | select(.status == "completed") | .databaseId')

          COUNT=0

          echo "开始检查历史记录..."
          echo ""

          for RUN_ID in $RUNS; do
            COUNT=$((COUNT + 1))

            if [ "$COUNT" -le 10 ]; then
              echo "保留第 ${COUNT} 笔：${RUN_ID}"
            else
              echo "删除第 ${COUNT} 笔旧记录：${RUN_ID}"

              gh run delete "$RUN_ID"                 --repo "${{ github.repository }}"                 --confirm || true
            fi
          done

          echo ""
          echo "=========================================="
          echo "清理完成"
          echo "保留最新 10 笔已结束记录"
          echo "=========================================="
